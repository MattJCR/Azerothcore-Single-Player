#   sustituye a OnGetStartPersonalRating), mod-playerbots (8 commits,
#   reescritura de Zul'Aman, arreglos de Gruul, guard null en HandleCommand)
#   y mod-aoe-loot (1 commit, no fusiona loot reservado por tirada de grupo)
#   a lo último de su rama. Revisado antes: OnPlayerResurrect (parche de
#   mod-challenge-modes) sin cambios; OnGetStartPersonalRating sin uso en
#   ningún módulo propio ni de terceros instalado; PointMovementGenerator sin
#   uso propio; sin claves de conf eliminadas; nuestros parches de
#   mod-playerbots (01-04) y mod-aoe-loot no se solapan con los ficheros
#   tocados. Añadido modules/mod-arac-trainer-audit, que usa los hooks nuevos
#   de entrenador para verificar en el log los instructores genéricos de
#   ARAC (ver CHANGELOG: se descartó generalizar por datos el parche de
#   Domar Bestia a todo playercreateinfo_spell_custom, produce ~200 filas sin
#   sentido, sobre todo pasivos/raciales/idiomas).
# 2026-09-23: core (99 commits: la BD de playerbots sale del core al módulo,
#   Spell con lanzador WorldObject, isLogingOut -> IsLoggingOut, hook de
#   entrenador antes de lanzar la entrada), mod-playerbots (18, va a la par con
#   el core), mod-dungeon-clear (4), mod-individual-progression (1, Naxx40),
#   mod-instanced-worldbosses y mod-racial-trait-swap (solo CI). Reinstalación
#   limpia de la VM ese mismo día. Ver CHANGELOG.
# 2026-09-24: retirado del proyecto el módulo de talentos por era (fila, espejo
#   y parches); reinstalación limpia de la VM para comprobarlo. Ver CHANGELOG.
# 2026-09-27: mod-aoe-loot (1 commit: correo si no caben en las bolsas, tras
#   AOELoot.MailEnable=0 por defecto), mod-individual-progression (2: arregla
#   el teleport de emergencia a homebind y el crédito de misión de banda en
#   la puerta de AQ), mod-random-enchants (1: mismo arreglo SQL que ya traía
#   nuestro parche + return -1 en el camino sin resultados) y mod-dungeon-clear
#   (2: compatibilidad con la forma nueva de hooks de mod-playerbots, aditivo,
#   compila igual contra nuestro playerbots pinneado) a lo último de su rama.
#   Revisado antes: sin conf ni comandos nuevos en ninguno de los cuatro;
#   01-module-string-collation.patch (mod-aoe-loot) sigue aplicando igual;
#   01-level-scaled-tiers.patch (mod-random-enchants) reescrito porque el
#   arreglo SQL ya pasó a ser de fábrica, se queda sólo el tope de tier por
#   nivel. Desplegado, recompilado (26m40s), verificado y congelado con
#   --freeze el mismo día. Ver CHANGELOG.
# 2026-10-01: mod-dungeon-clear a b501c63 (25 commits: Karazhan con ajedrez de
