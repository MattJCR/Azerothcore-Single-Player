server {
    listen __HTTP_PORT__ default_server;
    listen [::]:__HTTP_PORT__ default_server;
    server_name _;

    server_tokens off;

    location = /azerothcore-panel-ca.crt {
        alias /etc/azerothcore-panel/tls/ca.crt;
        default_type application/x-x509-ca-cert;
        add_header Content-Disposition 'attachment; filename="azerothcore-panel-ca.crt"';
    }

    location / {
        return 308 https://$host__HTTPS_SUFFIX__$request_uri;
    }
}

server {
    listen __HTTPS_PORT__ ssl default_server;
    listen [::]:__HTTPS_PORT__ ssl default_server;
    server_name _;

    ssl_certificate __TLS_CERTIFICATE__;
    ssl_certificate_key __TLS_KEY__;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:AZEROTH_TLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    server_tokens off;
    client_max_body_size 16k;

    location = /azerothcore-panel-ca.crt {
        alias /etc/azerothcore-panel/tls/ca.crt;
        default_type application/x-x509-ca-cert;
        add_header Content-Disposition 'attachment; filename="azerothcore-panel-ca.crt"';
    }

    # Lotes de recursos del cliente (MPQ extraídos por el navegador del administrador):
    # hasta 64 MiB por petición, sólo en esta ruta. El resto del panel sigue en 16k.
    location /api/recursos/ {
        client_max_body_size 80m;
        proxy_request_buffering off;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 5s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }
}
